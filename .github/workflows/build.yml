name: Build and test

on:
  push:
    branches: [main, development, 'feature/**']
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNCREC_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  asi-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DNCREC_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package prototype
        uses: actions/upload-artifact@v4
        with:
          name: NCREC-ASI-Windows-x64
          path: |
            build/bin/x64/plugins/Release/NCREC.asi
            LICENSE
            licenses/Inter-OFL.txt
            licenses/JetBrainsMono-OFL.txt
            licenses/nlohmann-json-MIT.txt
            src/platform/dx12/LICENSE
          if-no-files-found: error

  red4ext-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure safe RED4ext host
        run: cmake -S . -B build-red4ext -A x64 -DNCREC_BUILD_PLUGIN=OFF -DNCREC_BUILD_RED4EXT=ON
      - name: Build RED4ext DLL
        run: cmake --build build-red4ext --config Release --target NCREC_RED4ext
      - name: Run core and workspace tests
        run: |
          cmake --build build-red4ext --config Release --target ncrec_core_tests
          ctest --test-dir build-red4ext -C Release --output-on-failure
      - name: Package loader-only DLL
        uses: actions/upload-artifact@v4
        with:
          name: NCREC-RED4ext-bootstrap-Windows-x64
          path: |
            build-red4ext/red4ext/plugins/NCREC/Release/NCREC.dll
            LICENSE
            licenses/RED4ext-SDK-MIT.txt
          if-no-files-found: error
