name: Build and test

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNCREC_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  asi-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DNCREC_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package prototype
        uses: actions/upload-artifact@v4
        with:
          name: NCREC-ASI-Windows-x64
          path: build/bin/x64/plugins/Release/NCREC.asi
          if-no-files-found: error
