name: Development RED4ext DLL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ncrec-development-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-development-dll:
    name: Build / test / package Windows DLL
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure RED4ext (legacy ASI disabled)
        run: cmake -S . -B build-dev -A x64 -DNCREC_BUILD_PLUGIN=OFF -DNCREC_BUILD_RED4EXT=ON

      - name: Build DLL and native tests
        run: cmake --build build-dev --config Release --target NCREC_RED4ext ncrec_core_tests

      - name: Run tests
        run: ctest --test-dir build-dev -C Release --output-on-failure

      - name: Stage game-installable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ncrec-package'
          $plugin = Join-Path $root 'red4ext/plugins/NCREC'
          $notices = Join-Path $root 'licenses'
          New-Item -ItemType Directory -Force $plugin, $notices | Out-Null

          $dll = 'build-dev/red4ext/plugins/NCREC/Release/NCREC.dll'
          if (-not (Test-Path $dll)) { throw "NCREC.dll build output missing: $dll" }
          Copy-Item $dll (Join-Path $plugin 'NCREC.dll')
          Copy-Item LICENSE (Join-Path $root 'LICENSE.txt')
          Copy-Item 'licenses/RED4ext-SDK-MIT.txt' (Join-Path $notices 'RED4ext-SDK-MIT.txt')
          Copy-Item 'licenses/nlohmann-json-MIT.txt' (Join-Path $notices 'nlohmann-json-MIT.txt')
          Copy-Item 'licenses/Inter-OFL.txt' (Join-Path $notices 'Inter-OFL.txt')
          Copy-Item 'licenses/JetBrainsMono-OFL.txt' (Join-Path $notices 'JetBrainsMono-OFL.txt')
          Copy-Item 'licenses/FontAwesome-Free-LICENSE.txt' (Join-Path $notices 'FontAwesome-Free-LICENSE.txt')
          Copy-Item 'examples/NCREC-preview.ini.example' (Join-Path $plugin 'NCREC-preview.ini.example')

          $readme = @'
          NCREC DEVELOPMENT BUILD - RED4ext passive renderer test
          ======================================================

          DEFAULT MODE IS STILL THE VERIFIED LOADER-ONLY BOOTSTRAP.
          There is no NCREC window unless you explicitly enable the
          optional render-only preview in NCREC.ini.

          INSTALL
          1. Make sure a Cyberpunk-version-compatible RED4ext loader is installed.
          2. Remove old bin/x64/plugins/NCREC.asi. Never run both.
          3. Copy the ZIP's red4ext folder into Cyberpunk 2077.
          4. Start the game. Normal game startup is expected by default.

          OPTIONAL FULLSCREEN RENDER PREVIEW (EXPERIMENTAL)
          1. In red4ext/plugins/NCREC/, rename NCREC-preview.ini.example
             to NCREC.ini.
          2. Start Cyberpunk 2077 version 2.50.
          3. Stay at the main menu or open the pause/ESC screen.
          4. First launch: choose a single key in keyboard-only setup,
              then press Enter to save. Esc hides, F8 reopens setup.
              CET's F10 is reserved. The saved key toggles the preview.
             You can change [Experimental] ToggleKey=F8 in NCREC.ini
             to F6-F9, F11-F12, Insert, Home, End, PageUp or PageDown.
             CET can keep its F10 binding.
          5. Check image stability, fullscreen layout and scrolling.
          6. Verify F8 closes it and Alt+F4 can still exit.

          WARNING
          - Font Awesome icons are now embedded in the DLL (menu, viewport,
            playback and inspector). They do NOT enable mouse interaction.
          - NOT INTERACTIVE. Mouse and keyboard still belong to the game.
           - Wizard keypresses also reach the game. Use main/pause menu.
          - DO NOT click on the UI expecting to edit keyframes.
          - No game camera control, pause/freeze, freecam or OBS.
          - May still conflict with other DXGI overlays; run menu-first.
          - If anything behaves badly, remove/rename NCREC.ini and
            restart Cyberpunk: safe loader-only behavior resumes.
          - Do NOT install the unstable legacy ASI with this DLL.
          - This is a TEST PRERELEASE, not a stable mod.
          '@
          Set-Content -Path (Join-Path $root 'README-TESTING.txt') -Value $readme -Encoding utf8

          $archive = Join-Path $env:GITHUB_WORKSPACE 'NCREC-development-build.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) { throw 'Development ZIP missing' }

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path 'NCREC-development-build.sha256' -Encoding ascii -Value "$hash  NCREC-development-build.zip"

      - name: Store build artifact (also available in PR checks)
        uses: actions/upload-artifact@v4
        with:
          name: NCREC-RED4ext-development-build
          path: |
            NCREC-development-build.zip
            NCREC-development-build.sha256
          if-no-files-found: error
          retention-days: 30

  publish-development-release:
    name: Update rolling development-build prerelease
    needs: build-development-dll
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NCREC-RED4ext-development-build
          path: dist

      - name: Publish or update development-build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="development-build"
          archive="dist/NCREC-development-build.zip"
          checksum="dist/NCREC-development-build.sha256"
          test -s "$archive"
          test -s "$checksum"
          cat > release-notes.md <<EOF
          **NCREC development build — NOT a stable release.**

          Built from main commit $GITHUB_SHA.
          Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          **Icons:** Font Awesome Free 6.4.0 solid icons are embedded.
          Menus, viewport tools, project actions and playback now use icons
          from the user's demo.html. Mouse interaction remains disabled.

          **Default:** previously verified RED4ext loader-only startup. Nothing
          appears in-game unless the optional preview is enabled.

          **Experimental F8 render-only preview:** rename
          red4ext/plugins/NCREC/NCREC-preview.ini.example to NCREC.ini,
          launch Cyberpunk 2077 v2.50 at the main/pause menu.
           Without a saved ToggleVK, keyboard-only setup asks for a key
           (F6-F9, F11-F12, Insert, Home, End, PageUp, PageDown).
           Press Enter to save, Esc to hide or F8 to reopen setup.
           CET F10 is reserved. The game receives wizard keystrokes.
          This draws the fullscreen ImGui layout but DOES NOT acquire input,
          freeze the game or manipulate the camera. The buttons are NOT
          interactive yet. The saved key toggles preview visibility.
          The single-key toggle is configurable with NCREC.ini ToggleKey,
          so other overlays such as CET may keep their own bindings.

          **Install:** download NCREC-development-build.zip, remove any old
          bin/x64/plugins/NCREC.asi, extract into the Cyberpunk 2077 folder.
          Requires a game-compatible RED4ext loader.

          **Recovery:** remove/rename NCREC.ini to return to the safe
          loader-only mode if the rendering preview is unstable.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "NCREC development-build (optional fullscreen preview)" \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --notes-file release-notes.md
            gh release upload "$tag" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --clobber
            # Move the rolling tag only after uploading a tested replacement.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$tag" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NCREC development-build (optional fullscreen preview)" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
